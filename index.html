<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوار</title>
<meta name="theme-color" content="#FDFAF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سوار">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<style>
:root{--bg:#FDFAF5;--bg2:#F7EEE4;--text:#3F3A37;--muted:#6F6761;--gold:#C2923F;--gold-l:#E3B66D;--pink:#E2A6A4;--line:#EADFD1;
  --top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
iframe{border:0;display:block;width:100%;height:100%;background:var(--bg)}

/* البوابة تملأ الشاشة */
#portal{position:fixed;inset:0;padding-top:var(--top);height:100%;width:100%}
#portal iframe{height:100%}

/* شاشة البداية */
#splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#FFFDF9 0,var(--bg) 45%,var(--bg2) 100%);transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.sp{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp img{width:min(260px,64vw);height:auto;animation:in .9s cubic-bezier(.2,.8,.2,1) both}
.bar{width:120px;height:3px;border-radius:3px;background:rgba(194,146,63,.15);overflow:hidden}
.bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-l),var(--pink));animation:run 1.3s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes run{0%{transform:translateX(120%)}100%{transform:translateX(-260%)}}

/* طبقة البرنامج داخل التطبيق */
#prog{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);transform:translateX(-100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#prog.on{transform:none}
.pbar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(var(--top) + 6px) 10px 6px;background:rgba(253,250,245,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:40px;min-width:44px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.pbtn:active{background:rgba(194,146,63,.12)}
.pbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ptitle{flex:1;min-width:0;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{position:relative;flex:1;min-height:0}
.pload{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);transition:opacity .3s}
.pload.out{opacity:0;pointer-events:none}

/* نافذة التثبيت */
#install{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center;background:rgba(63,58,55,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:min(460px,100%);margin:0 0 calc(12px + var(--bottom));padding:24px 22px 20px;border-radius:24px;background:#FFFDF9;box-shadow:0 24px 60px rgba(63,58,55,.25);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){#install{align-items:center}.sheet{margin:0}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.sheet img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 20px rgba(110,98,90,.18)}
.sheet h1{margin:0;font-size:19px}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
.steps{width:100%;display:flex;flex-direction:column;gap:8px;text-align:right}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#FBF6EF;font-size:14px}
.step b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#FBF0DC;color:#8C6524;font-size:12.5px}
.step svg{width:20px;height:20px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.btn{width:100%;height:50px;border:0;border-radius:999px;background:linear-gradient(180deg,#F0C3C1,#DE9C9A);color:var(--text);font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px -10px rgba(201,132,130,.8)}
.link{border:0;background:none;color:#A65F5D;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px}
.err{padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash"><div class="sp"><img src="icons/logo.webp" alt="سوار"><div class="bar"><i></i></div></div></div>

<div id="portal"></div>

<div id="prog" aria-hidden="true">
  <div class="pbar">
    <button class="pbtn" id="back" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span>رجوع</span></button>
    <div class="ptitle" id="ptitle"></div>
    <button class="pbtn" id="ext" aria-label="فتح في المتصفح" title="فتح في المتصفح"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg></button>
  </div>
  <div class="pbody" id="pbody"><div class="pload" id="pload"><div class="bar"><i></i></div></div></div>
</div>

<div id="install" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="iT">
    <img src="icons/apple-touch-icon.png" alt="">
    <h1 id="iT">تثبيت تطبيق سوار</h1>
    <div id="iBody"></div>
    <button class="link" id="iLater">لاحقاً</button>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PORTAL = String(window.SIWAR_PORTAL || '');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var ua = navigator.userAgent || '';
  var iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var deferred = null, progUrl = '';

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  /* ── البوابة ── */
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(PORTAL)) {
    $('portal').innerHTML = '<p class="err">لم يُضبط رابط البوابة في config.js</p>';
    $('splash').className = 'out';
  } else {
    var f = document.createElement('iframe');
    f.title = 'سوار';
    f.allow = 'clipboard-read; clipboard-write; fullscreen';
    f.src = PORTAL + '?app=1';
    f.onload = function () { setTimeout(function () { $('splash').className = 'out'; }, 250); };
    $('portal').appendChild(f);
    setTimeout(function () { $('splash').className = 'out'; }, 12000);
  }

  /* ── فتح البرنامج داخل التطبيق ── */
  function openProg(url, name) {
    progUrl = url;
    $('ptitle').textContent = name || '';
    var body = $('pbody'), old = body.querySelector('iframe');
    if (old) old.remove();
    $('pload').className = 'pload';
    var p = document.createElement('iframe');
    p.title = name || 'برنامج';
    p.allow = 'clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation';
    p.onload = function () { $('pload').className = 'pload out'; };
    p.src = url;
    body.appendChild(p);
    $('prog').className = 'on'; $('prog').setAttribute('aria-hidden', 'false');
    if (!history.state || !history.state.prog) history.pushState({ prog: 1 }, '');
  }
  function closeProg(fromHistory) {
    if ($('prog').className !== 'on') return;
    $('prog').className = ''; $('prog').setAttribute('aria-hidden', 'true');
    setTimeout(function () { var p = $('pbody').querySelector('iframe'); if (p) p.remove(); }, 350);
    progUrl = '';
    if (!fromHistory && history.state && history.state.prog) history.back();
  }
  $('back').onclick = function () { closeProg(false); };
  $('ext').onclick = function () { if (progUrl) window.open(progUrl, '_blank'); };
  window.addEventListener('popstate', function () { closeProg(true); });   // زر الرجوع في الجوال

  // الرسائل تُقبل من صفحات Apps Script فقط
  window.addEventListener('message', function (e) {
    if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
    var d = e.data || {};
    if (d.siwar === 'open' && /^https:\/\/script\.google\.com\//.test(String(d.url || ''))) openProg(String(d.url), String(d.name || ''));
    else if (d.siwar === 'close' || d.siwar === 'logout') closeProg(false);
  });

  /* ── التثبيت ── */
  var svgShare = '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var svgPlus = '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  var svgMenu = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>';
  function step(n, html) { return '<div class="step"><b>' + n + '</b><span>' + html + '</span></div>'; }
  function renderInstall() {
    var b = $('iBody');
    if (deferred) {
      b.innerHTML = '<p>أيقونة على الشاشة الرئيسية، وتفتح الأنظمة في نافذة مستقلة.</p>';
      var btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = 'تثبيت التطبيق';
      btn.onclick = function () {
        deferred.prompt();
        deferred.userChoice.then(function () { deferred = null; $('install').hidden = true; });
      };
      b.appendChild(btn);
    } else if (iOS) {
      b.innerHTML = '<div class="steps">' +
        step('1', 'افتح هذه الصفحة في متصفح Safari') +
        step('2', 'اضغط زر المشاركة ' + svgShare) +
        step('3', 'اختر «إضافة إلى الشاشة الرئيسية» ' + svgPlus) +
        '</div>';
    } else {
      b.innerHTML = '<div class="steps">' +
        step('1', 'افتح هذه الصفحة في Chrome أو Edge') +
        step('2', 'من قائمة المتصفح ' + svgMenu + ' اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»') +
        '</div>';
    }
  }
  function showInstall() { if (standalone) return; renderInstall(); $('install').hidden = false; }
  $('iLater').onclick = function () { $('install').hidden = true; };

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (!$('install').hidden) renderInstall();
  });
  window.addEventListener('appinstalled', function () { $('install').hidden = true; });

  // تظهر نافذة التثبيت عند فتح الصفحة من المتصفح (لا داخل التطبيق المثبّت)
  if (!standalone) setTimeout(showInstall, /[?&]install=1/.test(location.search) ? 300 : 1800);
})();
</script>
</body>
</html>
